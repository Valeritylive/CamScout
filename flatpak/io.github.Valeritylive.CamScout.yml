# Flatpak manifest for the release bundles built in CI (see .github/workflows).
# Python dependencies are installed from pinned PyPI wheels.
id: io.github.Valeritylive.CamScout
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: camscout
finish-args:
  # Discovery uses UDP multicast/broadcast (Dahua DHIP 37810, Hikvision SADP 37020);
  # configuration uses HTTP to the devices (Dahua CGI/RPC, Hikvision ISAPI).
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
      - type: file
        url: https://files.pythonhosted.org/packages/92/9d/c4e665119135114480843e7ab388fa94d8480650450e6f8e26b70d323a4c/urllib3-2.8.0-py3-none-any.whl
        sha256: 0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/6d/39/5eec3296860b94ac20bb8ed807725b88f6adfab3f343df592afd975f5f86/certifi-2026.11.20-py3-none-any.whl
        sha256: 7422df25243767b9877031a2248cb14d09ddac9beee846f4cef3d5c9191d488f
      - type: file
        url: https://files.pythonhosted.org/packages/d2/0d/07ab8eb9b7015274353eac2add4067bde1ab1b51912bbae505392905eedd/charset_normalizer-3.5.3-py3-none-any.whl
        sha256: 96e268b0cbda016ac519513294fcd17032264085b600abaac58b93049477e132
      - type: file
        url: https://files.pythonhosted.org/packages/b6/ae/315bbeee126a769cbde43cf4908acb4b40408d8bf8bbf334dd7368d8dadf/pycparser-3.12-py3-none-any.whl
        sha256: a076f3f489b39b43ed13563a1dafe42447445bec2e294154ec5c57fcdda4c85e
      - type: file
        url: https://files.pythonhosted.org/packages/e9/02/4e7d553a7ac4b4238b38b3c1b80d486e9d4436f8d2acbf87a0997fe3f402/cffi-2.1.1-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: b0431303acaea1089ad4b3e9ce4e6518193def1118d4073ca848635ee4ea2e96
      - type: file
        url: https://files.pythonhosted.org/packages/d3/69/2c833a049475e0a3444e94c7d0aca0aa51d166374a449b09e92ac98138de/cryptography-50.0.2-cp311-abi3-manylinux_2_34_x86_64.whl
        sha256: 9dab55f57c74c3cad24c323bacbbd04be4705ba6eb0d92e920b1fc4837ed5079
      - type: file
        url: https://files.pythonhosted.org/packages/dd/b8/d2d6d731733f51684bbf76bf34dab3b70a9148e8f2cef2bb544fccec681a/qrcode-8.2-py3-none-any.whl
        sha256: 16e64e0716c14960108e85d853062c9e8bba5ca8252c0b4d0231b9df4060ff4f

  - name: camscout
    buildsystem: simple
    build-commands:
      - install -Dm0644 -t ${FLATPAK_DEST}/share/camscout *.py
      - install -Dm0644 -t ${FLATPAK_DEST}/share/camscout/locales locales/*.json
      - install -Dm0644 -t ${FLATPAK_DEST}/share/camscout/data data/${FLATPAK_ID}.svg
      - install -Dm0755 data/camscout.sh ${FLATPAK_DEST}/bin/camscout
      - install -Dm0644 -t ${FLATPAK_DEST}/share/applications data/${FLATPAK_ID}.desktop
      - install -Dm0644 -t ${FLATPAK_DEST}/share/metainfo data/${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps data/${FLATPAK_ID}.svg
      - install -Dm0644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - python3 -m compileall -q ${FLATPAK_DEST}/share/camscout
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - AppDir
          - .appimage-tools
